name: Gerar snake

on:
  schedule:
    - cron: "0 */12 * * *" # atualiza a cada 12 horas
  workflow_dispatch: # permite rodar na mão pela aba Actions
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # gera a cobrinha a partir do gráfico de contribuições
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # publica os SVGs no branch "output", que o README referencia
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
